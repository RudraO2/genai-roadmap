<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Learn AI one useful step at a time. Explore four learning paths, follow guided activities, and always know what to try next. No account needed."
    />
    <!-- Paints the phone browser's own chrome in the page's paper, so the app
         does not sit in a white or black frame it did not choose. The value is
         left empty on purpose and filled in main.tsx from --surface-base:
         theme.css is the only file allowed to hold a colour, and the theme gate
         reads this file too. -->
    <meta name="theme-color" content="" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- What a shared link unfurls into.

         These URLs are the only absolute ones in the project, and they have to
         be: Open Graph requires an absolute og:image, and a canonical link is
         absolute by definition. Everything else stays relative so the same dist/
         serves from any root (see vite.config.ts). If the site moves, this block
         is the one place to change.

         public/og.png is generated from og-card.html, a real page built out of
         the project's own stylesheet — see DESIGN.md. -->
    <link rel="canonical" href="https://rudrao2.github.io/genai-roadmap/" />
    <meta property="og:url" content="https://rudrao2.github.io/genai-roadmap/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Gen AI Roadmap" />
    <meta property="og:title" content="The Gen AI Roadmap" />
    <meta
      property="og:description"
      content="AI feels big. Start small. Explore four learning paths with guided activities and a clear next step."
    />
    <meta property="og:image" content="https://rudrao2.github.io/genai-roadmap/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Gen AI Roadmap: learn generative AI, in order. Four paths — AI Explorer, AI Engineer, Model Builder, Creative Studio."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <title>The Gen AI Roadmap</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
