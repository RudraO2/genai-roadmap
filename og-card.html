<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Share card source — The Gen AI Roadmap</title>
    <!--
      The source of public/og.png, and not part of the built site: Vite builds
      index.html only, so this file is served by `npm run dev` and never lands in
      dist/.

      It exists as a real page rather than as a hand-drawn SVG so the card is set
      in the project's own faces, at the project's own sizes, out of the project's
      own tokens — a share card drawn in approximated type is a share card that
      misrepresents the thing it links to. Nothing here holds a literal; it all
      comes through src/index.css.

      To regenerate after a theme change:
        npm run dev
        open http://localhost:5173/og-card.html
        screenshot the 1200x630 .card element to public/og.png
    -->
    <link rel="stylesheet" href="/src/index.css" />
    <style>
      body { margin: 0; background: var(--text-muted); }
      .card {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 64px 72px;
        background: var(--surface-base);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .card__mark {
        display: inline-flex;
        align-items: center;
        gap: 20px;
        font-family: var(--font-mono);
        font-size: 22px;
        font-weight: var(--weight-bold);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--text-secondary);
      }
      .card__mark img { width: 56px; height: 56px; border-radius: 8px; }
      .card__title {
        font-family: var(--font-display);
        font-size: 96px;
        font-weight: var(--weight-black);
        letter-spacing: var(--tracking-tight);
        line-height: 0.95;
        color: var(--text-primary);
        margin: 0;
      }
      .card__standfirst {
        font-family: var(--font-body);
        font-size: 30px;
        line-height: 1.35;
        color: var(--text-secondary);
        margin: 28px 0 0;
        max-width: 34ch;
      }
      .card__paths { display: flex; gap: 14px; }
      .card__path {
        white-space: nowrap;
        border: 3px solid var(--surface-road);
        border-radius: 6px;
        padding: 10px 18px;
        font-family: var(--font-display);
        font-size: 24px;
        font-weight: var(--weight-black);
        letter-spacing: var(--tracking-tight);
        color: var(--text-primary);
      }
      .card__path:nth-child(1) { background: var(--path-explorer); }
      .card__path:nth-child(2) { background: var(--path-engineer); }
      .card__path:nth-child(3) { background: var(--path-builder); }
      .card__path:nth-child(4) { background: var(--path-creator); }
      .card__foot {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 32px;
        border-top: 4px solid var(--rule);
        padding-top: 28px;
      }
      .card__count {
        font-family: var(--font-mono);
        font-size: 22px;
        font-weight: var(--weight-bold);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--text-secondary);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <p class="card__mark"><img src="/icon.svg" alt="" />The Gen AI Roadmap</p>
        <h1 class="card__title">Learn generative AI, in order.</h1>
        <p class="card__standfirst">
          Four paths, 94 quests. What to do, when you are allowed to do it, and exactly where
          to go and learn it.
        </p>
      </div>
      <div class="card__foot">
        <div class="card__paths">
          <span class="card__path">AI Explorer</span>
          <span class="card__path">AI Engineer</span>
          <span class="card__path">Model Builder</span>
          <span class="card__path">Creative Studio</span>
        </div>
        <p class="card__count">196 checked links</p>
      </div>
    </div>
  </body>
</html>
