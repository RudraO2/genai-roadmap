<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Gen AI Roadmap">
  <title>The Gen AI Roadmap</title>
  <!--
    The map's own motif: a routed path with three stops, drawn with the same
    orthogonal jog and rounded corner the graph edges use. Letterforms were the
    first attempt and the wrong one — a two-letter monogram at 16 pixels is a
    smudge, and this project's subject is the route, not its initials.

    Full bleed, with no paper margin of its own. It is the favicon, the manifest
    icon and the iOS home-screen icon, and every one of those surfaces supplies
    its own frame: a browser tab crops it square, iOS rounds it. A margin drawn
    here would be a second frame inside theirs.

    An icon is an asset, like the font files beside it, not a stylesheet, which
    is why these two values sit here rather than being spent as tokens. They are
    the ink and the ground from src/theme.css and must be changed with them.
    DESIGN.md records the exception.
  -->
  <rect width="64" height="64" fill="#17191b"/>
  <path
    d="M18 15 v10 a6 6 0 0 0 6 6 h16 a6 6 0 0 1 6 6 v12"
    fill="none" stroke="#fffceb" stroke-width="4" stroke-linecap="round"/>
  <circle cx="18" cy="15" r="6" fill="#fffceb"/>
  <circle cx="46" cy="49" r="6" fill="#fffceb"/>
  <circle cx="32" cy="31" r="4.5" fill="#17191b" stroke="#fffceb" stroke-width="3"/>
</svg>
